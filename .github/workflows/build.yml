name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download web libraries
        run: |
          set -e
          LIB=app/src/main/assets/viewer/lib
          mkdir -p "$LIB/addons/controls"
          npm install --no-audit --no-fund occt-import-js three@0.160.0
          cp node_modules/occt-import-js/dist/occt-import-js.js   "$LIB/"
          cp node_modules/occt-import-js/dist/occt-import-js.wasm "$LIB/"
          cp node_modules/three/build/three.module.js             "$LIB/"
          cp node_modules/three/examples/jsm/controls/OrbitControls.js "$LIB/addons/controls/"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Ensure stable signing key
        run: |
          set -e
          mkdir -p signing
          if [ ! -f signing/stepviewer.jks ]; then
            keytool -genkeypair -v -keystore signing/stepviewer.jks -storetype JKS \
              -storepass stepviewer -keypass stepviewer -alias stepviewer \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=STEP Viewer, O=StepViewer, C=RU"
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git add -f signing/stepviewer.jks
            git commit -m "Add stable signing key [skip ci]"
            git push origin HEAD:main
          else
            echo "Stable key already present"
          fi

      - name: Compute version
        id: ver
        run: |
          CODE=${{ github.run_number }}
          echo "code=$CODE" >> $GITHUB_OUTPUT
          echo "name=1.2.$CODE" >> $GITHUB_OUTPUT

      - name: Build APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          gradle assembleRelease -PciVersionCode=${{ steps.ver.outputs.code }} -PciVersionName=${{ steps.ver.outputs.name }} --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Save error log to repo
        if: steps.build.outcome == 'failure'
        run: |
          tail -n 300 build.log > ci-error.log
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -f ci-error.log
          git commit -m "CI error log [skip ci]"
          git push origin HEAD:main

      - name: Stop if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/StepViewer-${{ steps.ver.outputs.name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: StepViewer-${{ steps.ver.outputs.name }}
          path: out/*.apk
          if-no-files-found: error
